name: NOVA Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and package APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Prepare pinned PRoot runtime engine
        run: bash scripts/prepare-proot-engine.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-preview-0.4.0-build-${{ github.run_number }}
          name: NOVA Preview 0.4.0 (build ${{ github.run_number }})
          body: |
            NOVA Android workspace preview APK.
            Includes the SAF file manager, movable NOVA windows, adaptive monitoring, built-in previews,
            and an ARM64 PRoot-based Alpine Linux command-line installer/terminal.
            Linux graphical desktops, Wine/Box64 Windows execution, and Mali guest GPU translation are not included.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            third_party/oonid-pr-source.tar.gz
            third_party/PRootEngine-LICENSE.txt
          prerelease: true

  native-emulator-test:
    name: Native process instrumentation test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1 system-images;android-35;google_apis;x86_64 emulator'
      - name: Prepare pinned PRoot runtime engine
        run: bash scripts/prepare-proot-engine.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run native process test on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: gradle --no-daemon :app:connectedDebugAndroidTest
