name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11 for legacy PRoot build scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and NDK for build
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;23.2.8568313'

      - name: Fast Kotlin compile and unit-test gate
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Build relocatable PRoot executables and loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          if [[ ! -e "$HOME/Android/Sdk/ndk/23.2.8568313" ]]; then
            ln -s "$ANDROID_HOME/ndk/23.2.8568313" "$HOME/Android/Sdk/ndk/23.2.8568313"
          fi
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/build-proot-android
            if git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git /tmp/build-proot-android; then break; fi
            if [[ "$attempt" == 5 ]]; then echo "Unable to clone PRoot build sources after retries"; exit 1; fi
            sleep $((attempt * 8))
          done
          cd /tmp/build-proot-android
          retry_step() {
            local step="$1"; shift
            for attempt in 1 2 3 4; do
              echo "Running ${step} (attempt ${attempt}/4)"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 4 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          retry_download() {
            local step="$1"; local source_dir="$2"; shift 2
            for attempt in 1 2 3 4 5; do
              echo "${step} (attempt ${attempt}/5)"
              rm -rf "$source_dir"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 5 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          # Samba's primary download host returned repeated 503/504 responses in CI.
          # Fetch the same pinned release from mirrors and verify its published MD5 before extraction.
          cat > get-talloc.sh <<'TALLOC_FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          . ./config
          cd "$BUILD_DIR"
          target="talloc-$TALLOC_V"
          [[ -d "$target" ]] && exit 0
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          expected="7478da02e309316231a497a9f17a980d"
          urls=(
            "https://mirror.freedif.org/pub/blfs/conglomeration/talloc/talloc-$TALLOC_V.tar.gz"
            "https://macports.distfiles.ionic.de/talloc/talloc-$TALLOC_V.tar.gz"
            "https://www.samba.org/ftp/talloc/talloc-$TALLOC_V.tar.gz"
          )
          for url in "${urls[@]}"; do
            echo "Fetching talloc source from $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 "$url" -o "$tmp"; then
              if echo "$expected  $tmp" | md5sum --check --status; then
                mkdir -p "$target"
                tar -xzf "$tmp" --strip-components=1 -C "$target"
                echo "Verified talloc $TALLOC_V source archive"
                exit 0
              fi
              echo "Checksum mismatch from $url; trying next mirror"
            fi
          done
          echo "Unable to fetch a verified talloc $TALLOC_V archive from any mirror" >&2
          exit 1
          TALLOC_FETCH
          chmod +x get-talloc.sh
          retry_download "Download talloc sources" "build/talloc-2.1.14" ./get-talloc.sh
          retry_download "Download PRoot sources" "build/proot-0.15_release" ./get-proot.sh
          echo "Converting bundled Waf/talloc Python 2 source to Python 3"
          find build/talloc-2.1.14/third_party/waf -type f -name '*.py' -print0 | xargs -0 python -m lib2to3 -w -n
          python -m lib2to3 -w -n build/talloc-2.1.14/wscript build/talloc-2.1.14/buildtools
          python -m lib2to3 -w -n build/talloc-2.1.14/buildtools/bin/waf
          # Python 3 rejects mixed indentation in several legacy Samba Waf scripts.
          # Normalize tabs consistently after conversion, including extensionless wscript files.
          python - <<'PY'
          from pathlib import Path
          root = Path("build/talloc-2.1.14")
          candidates = [p for p in root.rglob("*") if p.is_file() and (p.suffix == ".py" or p.name == "wscript")]
          for path in candidates:
              try:
                  source = path.read_text()
              except UnicodeDecodeError:
                  continue
              # Waf's cc.py embeds a second Python program in a string and
              # executes it. Its escaped tab sequences survive expandtabs(),
              # then become real tabs in the generated program and trigger
              # Python 3 TabError. Normalize those embedded indentation tabs.
              if path.name == "cc.py" and "wafadmin/Tools" in path.as_posix():
                  source = source.replace(chr(92) + "t", "        ")
              normalized = source.expandtabs(8)
              if normalized != source:
                  path.write_text(normalized)
          PY
          # Normalize the generated C compiler task template before Waf compiles it.
          python - <<'PY'
          from pathlib import Path
          cc_path = Path("build/talloc-2.1.14/third_party/waf/wafadmin/Tools/cc.py")
          cc_source = cc_path.read_text()
          needle = "cls = Task.simple_task_type('cc', cc_str,"
          replacement = "cc_str = cc_str.replace(chr(9), '    ')\n" + needle
          if needle not in cc_source:
              raise SystemExit("Could not find Waf C compiler task template")
          cc_path.write_text(cc_source.replace(needle, replacement, 1))
          PY
          # Normalize legacy generated task source at Waf's final Python exec boundary.
          python - <<'PY'
          from pathlib import Path
          task_path = Path("build/talloc-2.1.14/third_party/waf/wafadmin/Task.py")
          task_source = task_path.read_text()
          if "exec(c, dc)" not in task_source:
              raise SystemExit("Could not find Waf generated-task exec boundary")
          task_path.write_text(task_source.replace("exec(c, dc)", "exec(c.expandtabs(8), dc)", 1))
          PY
          # Waf loads Samba helpers as top-level modules, not as a Python package.
          # lib2to3's import fixer creates package-relative imports that fail in that mode.
          # Restore absolute sibling imports and assert the helper tree is package-independent.
          python - <<'PY'
          from pathlib import Path
          import re
          package = Path("build/talloc-2.1.14/buildtools/wafsamba")
          for path in package.rglob("*.py"):
              source = path.read_text()
              fixed = re.sub(
                  r"(?m)^from \. import ([A-Za-z_][A-Za-z0-9_]*(?:\s*,\s*[A-Za-z_][A-Za-z0-9_]*)*)\s*$",
                  r"import \1",
                  source,
              )
              fixed = re.sub(
                  r"(?m)^from \.([A-Za-z_][A-Za-z0-9_]*) import ",
                  r"from \1 import ",
                  fixed,
              )
              if re.search(r"(?m)^from \.", fixed):
                  raise SystemExit("Unresolved package-relative import in %s" % path)
              if fixed != source:
                  path.write_text(fixed)
          PY
          find build/talloc-2.1.14/third_party/waf/wafadmin -type f -name '*.py' -exec sed -i -E \
            -e 's/from \. import /import /g' \
            -e 's/from \.([A-Za-z_][A-Za-z0-9_]*) import /from \1 import /g' {} +
          python - <<'PY'
          from pathlib import Path
          utils_path = Path("build/talloc-2.1.14/third_party/waf/wafadmin/Utils.py")
          utils = utils_path.read_text()
          if "f = open(fname, m)" not in utils:
              raise SystemExit("Could not find legacy Waf file-open mode")
          utils_path.write_text(utils.replace("f = open(fname, m)", "f = open(fname, m.replace('U', ''))", 1))
          options_path = Path("build/talloc-2.1.14/third_party/waf/wafadmin/Options.py")
          options = options_path.read_text()
          if "default_jobs = int(default_jobs)" not in options:
              if "if default_jobs < 1:" not in options:
                  raise SystemExit("Could not find legacy Waf worker-count check")
              options = options.replace("if default_jobs < 1:", "default_jobs = int(default_jobs)\nif default_jobs < 1:", 1)
              options_path.write_text(options)
          PY
          # The standalone talloc release omits this optional Samba hook, but
          # its bundled lib/replace Waf script probes it unconditionally.
          cat > build/talloc-2.1.14/buildtools/wafsamba/wscript_set_options <<'PY'
          def set_options(opt):
              pass
          PY
          # The bundled talloc Waf version does not recognize this flag.
          sed -i -e 's/--disable-rpath//g' -e 's/--disable-python//g' -e 's/--cross-compile//g' -e 's/--cross-answers=cross-answers.txt//g' make-talloc-static.sh
          cat > build/talloc-2.1.14/buildtools/wafsamba/wscript_configure <<'PY'
          def configure(conf):
              conf.load('compiler_c')
          PY
          cat > build/talloc-2.1.14/buildtools/wafsamba/wscript_build <<'PY'
          def build(bld):
              pass
          PY
          retry_step "Build static talloc dependency" ./make-talloc-static.sh
          retry_step "Build PRoot executables" ./make-proot.sh
          retry_step "Package PRoot outputs" ./pack.sh
          retry_step "Create APK-compatible PRoot loaders" ./make-proot-for-apk.sh
          declare -A abi_map=(
            [aarch64]=arm64-v8a
            [armv7a]=armeabi-v7a
            [x86_64]=x86_64
            [i686]=x86
          )
          for arch in aarch64 armv7a x86_64 i686; do
            src="$PWD/build/root-$arch/root-apk/bin"
            test -s "$src/libproot-userland.so"
            test -s "$src/libproot-loader.so"
            out="$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi_map[$arch]}"
            mkdir -p "$out"
            cp "$src/libproot-userland.so" "$out/libproot.so"
            cp "$src/libproot-loader.so" "$out/libproot-loader.so"
            if [[ -s "$src/libproot.so" ]]; then cp "$src/libproot.so" "$out/libproot-regular.so"; fi
            if [[ -s "$src/libproot-loader32.so" ]]; then cp "$src/libproot-loader32.so" "$out/libproot-loader32.so"; fi
            chmod 755 "$out"/*.so
          done

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
