name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11 for legacy PRoot build scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and NDK for build
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;23.2.8568313'

      - name: Fast Kotlin compile and unit-test gate
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Build relocatable PRoot executables and loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          if [[ ! -e "$HOME/Android/Sdk/ndk/23.2.8568313" ]]; then
            ln -s "$ANDROID_HOME/ndk/23.2.8568313" "$HOME/Android/Sdk/ndk/23.2.8568313"
          fi
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/build-proot-android
            if git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git /tmp/build-proot-android; then break; fi
            if [[ "$attempt" == 5 ]]; then echo "Unable to clone PRoot build sources after retries"; exit 1; fi
            sleep $((attempt * 8))
          done
          cd /tmp/build-proot-android
          # Use the SDK/NDK location provisioned by setup-android, not the upstream local-machine default.
          python - <<'PY'
          from pathlib import Path
          p = Path("config")
          s = p.read_text()
          old = 'NDK="$HOME/Android/Sdk/ndk/23.2.8568313"'
          new = 'NDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}/ndk/23.2.8568313"'
          if old not in s:
              raise SystemExit("Expected hardcoded NDK path not found in upstream config")
          p.write_text(s.replace(old, new, 1))
          PY
          retry_step() {
            local step="$1"; shift
            for attempt in 1 2 3 4; do
              echo "Running ${step} (attempt ${attempt}/4)"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 4 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          retry_download() {
            local step="$1"; local source_dir="$2"; shift 2
            for attempt in 1 2 3 4 5; do
              echo "${step} (attempt ${attempt}/5)"
              rm -rf "$source_dir"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 5 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          # Samba's primary download host returned repeated 503/504 responses in CI.
          # Fetch the same pinned release from mirrors and verify its published MD5 before extraction.
          cat > get-talloc.sh <<'TALLOC_FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          . ./config
          cd "$BUILD_DIR"
          target="talloc-$TALLOC_V"
          [[ -d "$target" ]] && exit 0
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          expected="7478da02e309316231a497a9f17a980d"
          urls=(
            "https://mirror.freedif.org/pub/blfs/conglomeration/talloc/talloc-$TALLOC_V.tar.gz"
            "https://macports.distfiles.ionic.de/talloc/talloc-$TALLOC_V.tar.gz"
            "https://www.samba.org/ftp/talloc/talloc-$TALLOC_V.tar.gz"
          )
          for url in "${urls[@]}"; do
            echo "Fetching talloc source from $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 "$url" -o "$tmp"; then
              if echo "$expected  $tmp" | md5sum --check --status; then
                mkdir -p "$target"
                tar -xzf "$tmp" --strip-components=1 -C "$target"
                echo "Verified talloc $TALLOC_V source archive"
                exit 0
              fi
              echo "Checksum mismatch from $url; trying next mirror"
            fi
          done
          echo "Unable to fetch a verified talloc $TALLOC_V archive from any mirror" >&2
          exit 1
          TALLOC_FETCH
          chmod +x get-talloc.sh
          retry_download "Download talloc sources" "build/talloc-2.1.14" ./get-talloc.sh
          retry_download "Download PRoot sources" "build/proot-0.15_release" ./get-proot.sh
          # Build talloc directly with the Android NDK. The upstream release uses an old
          # Samba/Waf toolchain that is not required to produce the static library PRoot needs.
          cat > build-talloc-static-direct.sh <<'TALLOC_BUILD'
          #!/usr/bin/env bash
          set -euo pipefail
          . ./config
          for ARCH in $ARCHS; do
            set-arch "$ARCH"
            mkdir -p "$STATIC_ROOT/include" "$STATIC_ROOT/lib"
            src="$BUILD_DIR/talloc-$TALLOC_V/talloc.c"
            header="$BUILD_DIR/talloc-$TALLOC_V/talloc.h"
            test -s "$src"
            test -s "$header"
            obj="$BUILD_DIR/talloc-$TALLOC_V/talloc-$ARCH.o"
            "$CC" -std=gnu99 -O2 -fPIC -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -I"$BUILD_DIR/talloc-$TALLOC_V" -c "$src" -o "$obj"
            "$AR" rcs "$STATIC_ROOT/lib/libtalloc.a" "$obj"
            "$RANLIB" "$STATIC_ROOT/lib/libtalloc.a"
            cp "$header" "$STATIC_ROOT/include/talloc.h"
            echo "Built static libtalloc for $ARCH using $CC"
          done
          TALLOC_BUILD
          chmod +x build-talloc-static-direct.sh
          retry_step "Build static talloc dependency" ./build-talloc-static-direct.sh
          retry_step "Build PRoot executables" ./make-proot.sh
          retry_step "Package PRoot outputs" ./pack.sh
          retry_step "Create APK-compatible PRoot loaders" ./make-proot-for-apk.sh
          declare -A abi_map=(
            [aarch64]=arm64-v8a
            [armv7a]=armeabi-v7a
            [x86_64]=x86_64
            [i686]=x86
          )
          for arch in aarch64 armv7a x86_64 i686; do
            src="$PWD/build/root-$arch/root-apk/bin"
            test -s "$src/libproot-userland.so"
            test -s "$src/libproot-loader.so"
            out="$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi_map[$arch]}"
            mkdir -p "$out"
            cp "$src/libproot-userland.so" "$out/libproot.so"
            cp "$src/libproot-loader.so" "$out/libproot-loader.so"
            if [[ -s "$src/libproot.so" ]]; then cp "$src/libproot.so" "$out/libproot-regular.so"; fi
            if [[ -s "$src/libproot-loader32.so" ]]; then cp "$src/libproot-loader32.so" "$out/libproot-loader32.so"; fi
            chmod 755 "$out"/*.so
          done

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
