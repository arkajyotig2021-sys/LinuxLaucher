name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11 for legacy PRoot build scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and NDK for build
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;23.2.8568313'

      - name: Fast Kotlin compile and unit-test gate
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Build relocatable PRoot executables and loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          if [[ ! -e "$HOME/Android/Sdk/ndk/23.2.8568313" ]]; then
            ln -s "$ANDROID_HOME/ndk/23.2.8568313" "$HOME/Android/Sdk/ndk/23.2.8568313"
          fi
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/build-proot-android
            if git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git /tmp/build-proot-android; then break; fi
            if [[ "$attempt" == 5 ]]; then echo "Unable to clone PRoot build sources after retries"; exit 1; fi
            sleep $((attempt * 8))
          done
          cd /tmp/build-proot-android
          # Use the SDK/NDK location provisioned by setup-android, not the upstream local-machine default.
          python - <<'PY'
          from pathlib import Path
          p = Path("config")
          s = p.read_text()
          old = 'NDK="$HOME/Android/Sdk/ndk/23.2.8568313"'
          new = 'NDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}/ndk/23.2.8568313"'
          if old not in s:
              raise SystemExit("Expected hardcoded NDK path not found in upstream config")
          s = s.replace(old, new, 1)
          old_arches = "ARCHS='aarch64 armv7a armv7a-pre5 x86_64 i686 i686-pre5'"
          new_arches = "ARCHS='aarch64 armv7a x86_64 i686'"
          if old_arches not in s:
              raise SystemExit("Expected upstream architecture matrix not found")
          p.write_text(s.replace(old_arches, new_arches, 1))
          PY
          retry_step() {
            local step="$1"; shift
            for attempt in 1 2 3 4; do
              echo "Running ${step} (attempt ${attempt}/4)"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 4 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          retry_download() {
            local step="$1"; local source_dir="$2"; shift 2
            for attempt in 1 2 3 4 5; do
              echo "${step} (attempt ${attempt}/5)"
              rm -rf "$source_dir"
              if "$@"; then return 0; fi
              if [[ "$attempt" == 5 ]]; then echo "${step} failed after retries"; return 1; fi
              sleep $((attempt * 10))
            done
          }
          # Samba's primary download host returned repeated 503/504 responses in CI.
          # Fetch the same pinned release from mirrors and verify its published MD5 before extraction.
          cat > get-talloc.sh <<'TALLOC_FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          . ./config
          cd "$BUILD_DIR"
          target="talloc-$TALLOC_V"
          [[ -d "$target" ]] && exit 0
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          expected="7478da02e309316231a497a9f17a980d"
          urls=(
            "https://mirror.freedif.org/pub/blfs/conglomeration/talloc/talloc-$TALLOC_V.tar.gz"
            "https://macports.distfiles.ionic.de/talloc/talloc-$TALLOC_V.tar.gz"
            "https://www.samba.org/ftp/talloc/talloc-$TALLOC_V.tar.gz"
          )
          for url in "${urls[@]}"; do
            echo "Fetching talloc source from $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 "$url" -o "$tmp"; then
              if echo "$expected  $tmp" | md5sum --check --status; then
                mkdir -p "$target"
                tar -xzf "$tmp" --strip-components=1 -C "$target"
                echo "Verified talloc $TALLOC_V source archive"
                exit 0
              fi
              echo "Checksum mismatch from $url; trying next mirror"
            fi
          done
          echo "Unable to fetch a verified talloc $TALLOC_V archive from any mirror" >&2
          exit 1
          TALLOC_FETCH
          chmod +x get-talloc.sh
          retry_download "Download talloc sources" "build/talloc-2.1.14" ./get-talloc.sh
          retry_download "Download PRoot sources" "build/proot-0.15_release" ./get-proot.sh
          # Build talloc directly with the Android NDK. The upstream release uses an old
          # Samba/Waf toolchain that is not required to produce the static library PRoot needs.
          cat > build-talloc-static-direct.sh <<'TALLOC_BUILD'
          #!/usr/bin/env bash
          set -euo pipefail
          . ./config
          # talloc's standalone source includes Samba libreplace/config.h. The library itself
          # uses standard Android libc APIs, so provide the small feature header for NDK builds.
          cat > "$BUILD_DIR/talloc-$TALLOC_V/lib/replace/config.h" <<'TALLOC_CONFIG'
          #pragma once
          #include <limits.h>
          #define TALLOC_BUILD_VERSION_MAJOR 2
          #define TALLOC_BUILD_VERSION_MINOR 1
          #define TALLOC_BUILD_VERSION_RELEASE 14
          #define HAVE_STDINT_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_STRING_H 1
          #define HAVE_SYS_TYPES_H 1
          #define STDC_HEADERS 1
          #define HAVE_STRDUP 1
          #define HAVE_STRNDUP 1
          #define HAVE_MEMMOVE 1
          #define HAVE_STRNLEN 1
          #define HAVE_VSNPRINTF 1
          #define HAVE_C99_VSNPRINTF 1
          #define HAVE_FPRINTF 1
          #define HAVE_INTPTR_T 1
          #define HAVE_UINTPTR_T 1
          #define HAVE_PTRDIFF_T 1
          #define HAVE_USLEEP 1
          #define HAVE_SYS_AUXV_H 1
          #define HAVE_GETAUXVAL 1
          #define HAVE_VA_COPY 1
          #define HAVE___VA_COPY 1
          #define HAVE_CONSTRUCTOR_ATTRIBUTE 1
          TALLOC_CONFIG
          for ARCH in $ARCHS; do
            set-arch "$ARCH"
            mkdir -p "$STATIC_ROOT/include" "$STATIC_ROOT/lib"
            src="$BUILD_DIR/talloc-$TALLOC_V/talloc.c"
            header="$BUILD_DIR/talloc-$TALLOC_V/talloc.h"
            test -s "$src"
            test -s "$header"
            obj="$BUILD_DIR/talloc-$TALLOC_V/talloc-$ARCH.o"
            "$CC" -std=gnu99 -O2 -fPIC -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -I"$BUILD_DIR/talloc-$TALLOC_V" -I"$BUILD_DIR/talloc-$TALLOC_V/lib/replace" -c "$src" -o "$obj"
            "$AR" rcs "$STATIC_ROOT/lib/libtalloc.a" "$obj"
            "$RANLIB" "$STATIC_ROOT/lib/libtalloc.a"
            cp "$header" "$STATIC_ROOT/include/talloc.h"
            echo "Built static libtalloc for $ARCH using $CC"
          done
          TALLOC_BUILD
          chmod +x build-talloc-static-direct.sh
          retry_step "Build static talloc dependency" ./build-talloc-static-direct.sh
          retry_step "Build PRoot executables" ./make-proot.sh
          retry_step "Package PRoot outputs" ./pack.sh
          retry_step "Create APK-compatible PRoot loaders" ./make-proot-for-apk.sh
          declare -A abi_map=(
            [aarch64]=arm64-v8a
            [armv7a]=armeabi-v7a
            [x86_64]=x86_64
            [i686]=x86
          )
          for arch in aarch64 armv7a x86_64 i686; do
            src="$PWD/build/root-$arch/root-apk/bin"
            test -s "$src/libproot-userland.so"
            test -s "$src/libproot-loader.so"
            out="$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi_map[$arch]}"
            mkdir -p "$out"
            cp "$src/libproot-userland.so" "$out/libproot.so"
            cp "$src/libproot-loader.so" "$out/libproot-loader.so"
            if [[ -s "$src/libproot.so" ]]; then cp "$src/libproot.so" "$out/libproot-regular.so"; fi
            if [[ -s "$src/libproot-loader32.so" ]]; then cp "$src/libproot-loader32.so" "$out/libproot-loader32.so"; fi
            chmod 755 "$out"/*.so
          done

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          emulator-boot-timeout: 1200
          cores: 4
          ram-size: 3072M
          heap-size: 768M
          disable-animations: true
          script: adb wait-for-device && test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" && adb devices -l && adb shell getprop ro.build.version.sdk && gradle --no-daemon --info :app:connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare ARM64 APK for direct download
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/arm64-v8a/app-arm64-v8a-debug.apk LinuxLauncher-arm64-debug.apk

      - name: Publish smaller ARM64 APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linuxlauncher-arm64-${{ github.run_number }}
          name: Linux Launcher ARM64 build ${{ github.run_number }}
          body: |
            Device-specific ARM64 debug APK. This package contains only the ARM64 native PRoot runtime, reducing download size compared with the universal APK.

            Kaggle GPU and Android GPU passthrough are not available as desktop renderers in this build. CPU/VNC rendering remains the supported path.
          prerelease: true
          files: LinuxLauncher-arm64-debug.apk

      - name: Upload ABI-specific debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LinuxLauncher-debug-apks
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
