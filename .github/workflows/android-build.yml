name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK for PRoot build
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;23.2.8568313'

      - name: Build relocatable PRoot executables and loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          if [[ ! -e "$HOME/Android/Sdk/ndk/23.2.8568313" ]]; then
            ln -s "$ANDROID_HOME/ndk/23.2.8568313" "$HOME/Android/Sdk/ndk/23.2.8568313"
          fi
          git clone --depth 1 https://github.com/green-green-avk/build-proot-android.git /tmp/build-proot-android
          cd /tmp/build-proot-android
          ./build.sh
          ./make-proot-for-apk.sh
          declare -A abi_map=(
            [aarch64]=arm64-v8a
            [armv7a]=armeabi-v7a
            [x86_64]=x86_64
            [i686]=x86
          )
          for arch in aarch64 armv7a x86_64 i686; do
            src="$PWD/build/root-$arch/root-apk/bin"
            test -s "$src/libproot.so"
            test -s "$src/libproot-loader.so"
            out="$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi_map[$arch]}"
            mkdir -p "$out"
            cp "$src/libproot.so" "$out/libproot.so"
            cp "$src/libproot-loader.so" "$out/libproot-loader.so"
            if [[ -s "$src/libproot-loader32.so" ]]; then cp "$src/libproot-loader32.so" "$out/libproot-loader32.so"; fi
            if [[ -s "$src/libproot-userland.so" ]]; then cp "$src/libproot-userland.so" "$out/libproot-userland.so"; fi
            chmod 755 "$out"/*.so
          done

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
