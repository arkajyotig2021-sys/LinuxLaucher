name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Package Android PRoot binaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/green-green-avk/build-proot-android/raw/refs/heads/master/packages"
          mkdir -p app/src/main/jniLibs
          while read -r archive abi; do
            work="$(mktemp -d)"
            curl --fail --location --retry 3 "$base/$archive" -o "$work/proot.tar.gz"
            tar -xzf "$work/proot.tar.gz" -C "$work"
            root="$work/root"
            test -d "$root/bin"
            out="app/src/main/jniLibs/$abi"
            mkdir -p "$out"
            regular="$(find "$root" -type f -name proot -print -quit)"
            userland="$(find "$root" -type f -name proot-userland -print -quit)"
            loader="$(find "$root" -type f -name 'libproot-loader.so' -print -quit)"
            test -n "$regular" && test -n "$userland" && test -n "$loader"
            cp "$userland" "$out/libproot.so"
            cp "$regular" "$out/libproot-regular.so"
            cp "$loader" "$out/libproot-loader.so"
            loader32="$(find "$root" -type f -name 'libproot-loader32.so' -print -quit)"
            if [[ -n "$loader32" ]]; then cp "$loader32" "$out/libproot-loader32.so"; fi
            chmod 755 "$out"/*.so
            rm -rf "$work"
          done <<'ARCHES'
          proot-android-aarch64.tar.gz arm64-v8a
          proot-android-armv7a.tar.gz armeabi-v7a
          proot-android-x86_64.tar.gz x86_64
          proot-android-i686.tar.gz x86
          ARCHES

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinuxLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
